<script type="text/javascript">
  RED.nodes.registerType('surepetcare-devices', {
    category: 'SureFlap',
    color: '#667f91',
    defaults: {
      name: { value: '' },
      config: { value: '', type: 'surepetcare-config', required: true },
      pollInterval: { value: 60, validate: RED.validators.number() },
    },
    inputs: 1,
    outputs: 1,
    icon: 'paw.svg',
    label: function () {
      return this.name || 'surepetcare devices';
    },
    paletteLabel: 'surepetcare devices',
  });
</script>

<script type="text/html" data-template-name="surepetcare-devices">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> Poll interval (s)</label>
    <input type="number" id="node-input-pollInterval" min="60" step="1" />
  </div>
</script>

<script type="text/html" data-help-name="surepetcare-devices">
  <p>Polls the SurePetcare API for device status and emits one message per device, including
  the flap's live lock state and its configured curfew schedule.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload.deviceId <span class="property-type">string</span></dt>
    <dd>Device ID, for use with <code>surepetcare-control</code></dd>
    <dt>payload.name <span class="property-type">string</span></dt>
    <dd>Device name</dd>
    <dt class="optional">payload.lockingMode <span class="property-type">number</span></dt>
    <dd>Live lock state: 0 unlocked, 1 locked-in, 2 locked-out, 3 locked, 4 deferred to curfew
    schedule, -1 curfew currently locked, -2 curfew currently unlocked, -3 curfew status unknown</dd>
    <dt class="optional">payload.curfew <span class="property-type">array</span></dt>
    <dd>Configured curfew windows: <code>[{ lock_time, unlock_time, enabled }]</code></dd>
  </dl>
  <h3>Details</h3>
  <p>Send any message to the input to trigger an immediate poll.
  The node also polls automatically at the configured interval (minimum 60 s).</p>
  <p>A <code>lockingMode</code> of -1 means the device's own curfew has engaged, which only
  blocks exit (cats can still come back in). Wire this to a function node that, on -1, sends
  <code>{ lockState: 3 }</code> to <code>surepetcare-control</code> to upgrade it to a full
  lock, and on -2 releases it back to <code>{ lockState: 0 }</code> — see the
  "Curfew Full Lock" example flow.</p>
</script>
